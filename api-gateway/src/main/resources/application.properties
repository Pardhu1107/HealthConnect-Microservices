spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

spring.cloud.gateway.routes[1].id=practitioner-service
spring.cloud.gateway.routes[1].uri=lb://PRACTITIONER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/practitioners/**

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.routes[3].id=prescription-service
spring.cloud.gateway.routes[3].uri=lb://PRESCRIPTION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/prescriptions/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info,gateway
